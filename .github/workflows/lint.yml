name: Sunay Lint

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clang-tidy:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Clang 20
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20"

      - name: Install Ninja
        run: choco install ninja --yes --no-progress

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: "qtwebengine qtwebchannel qtpositioning"
          archives: "qtbase qtdeclarative"
          cache: true

      - name: Configure with compile commands
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy on the active Sunay library source
        shell: bash
        run: clang-tidy -p build src/rendering_pipeline.cpp
