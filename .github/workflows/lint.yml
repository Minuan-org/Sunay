name: Sunay Lint — Journey to Castle Clang

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  clang-tidy:
    runs-on: windows-latest

    steps:
      # The Human begins the journey
      - name: The Workflow Arrives in the Kingdom
        uses: actions/checkout@v4

      # The Human gathers the correct artifact
      - name: Acquire the Sacred Artifact (Clang 19)
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "19"

      # The Human prepares tools for the journey
      - name: Forge the Builder's Tool (Ninja)
        run: choco install ninja

      # The Human crafts the map needed to enter the castle
      - name: Generate the Compilation Map (compile_commands.json)
        run: cmake -B build -S . -G "Ninja" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # The Human approaches the castle and is inspected by the Guard
      - name: Approach Castle Clang (Run clang-tidy)
        shell: bash
        run: |
          clang-tidy -p build $(git ls-files '*.cpp')
